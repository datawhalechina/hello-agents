# ============================================================
# 会话管理配置
# 控制会话存储目录、自动保存等
# ============================================================

encoding: utf-8

# 会话文件存储目录（相对于项目根目录）
sessions_dir: "sessions"

# 默认会话 ID（当未指定 session_id 时使用）
default_session_id: "default"

# 是否在每轮对话后自动保存
auto_save: true

# 是否同时保存 todo 列表状态
save_todos: true

# 会话 ID 最大长度（用于生成新会话 ID）
session_id_length: 8
