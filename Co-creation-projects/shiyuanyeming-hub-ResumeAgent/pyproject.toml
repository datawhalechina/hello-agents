[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-agent-mentor"
version = "0.1.0"
description = "Evidence-driven, multi-agent resume mentoring core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["resume_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
