<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Hello-Agents</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="Description">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@latest/lib/themes/vue.css">
    <style>
        /* --- 1. 原有样式 (保留) --- */
        /* 语言切换按钮样式 */
        .lang-switch {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 999;
        }
        .lang-switch select {
            background: #42b983;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .lang-switch select:hover {
            background: #33a06f;
        }

        /* Giscus 评论区样式 */
        .giscus-container {
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid #eee;
        }

        /* 可折叠评论区标题 */
        .giscus-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .giscus-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .giscus-toggle-title {
            font-size: 1.3em;
            font-weight: 600;
            color: white;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .giscus-toggle-icon {
            font-size: 1.2em;
            transition: transform 0.3s ease;
            color: white;
        }

        .giscus-toggle-icon.expanded {
            transform: rotate(180deg);
        }

        .giscus-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease;
            opacity: 0;
        }

        .giscus-content.expanded {
            max-height: 2000px;
            opacity: 1;
            transition: max-height 0.5s ease-in, opacity 0.4s ease;
        }

        .giscus-hint {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
        }

        /* --- 2. 新增：暗黑模式样式 (Dark Mode Styles) --- */
        :root {
            --dark-bg: #1a1a1a;
            --dark-text: #c4c4c4;
            --dark-sidebar: #141414;
            --dark-code-bg: #2b2b2b;
            --dark-border: #333;
            --theme-color: #42b983;
        }

        /* 基础反色 */
        body.dark-mode {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }

        /* 侧边栏适配 */
        body.dark-mode .sidebar {
            background-color: var(--dark-sidebar);
            border-right: 1px solid var(--dark-border);
            color: var(--dark-text);
        }
        body.dark-mode .sidebar-nav li a {
            color: #999;
        }
        body.dark-mode .sidebar-nav li.active > a {
            color: var(--theme-color);
            border-right: 2px solid var(--theme-color);
        }

        /* 代码块适配 */
        body.dark-mode pre {
            background-color: var(--dark-code-bg) !important;
        }
        body.dark-mode code {
            background-color: var(--dark-code-bg) !important;
            color: #e0e0e0 !important;
        }
        body.dark-mode .markdown-section code {
            color: #f08d49;
            background-color: rgba(255,255,255,0.1);
        }

        /* 标题和引用适配 */
        body.dark-mode h1, body.dark-mode h2, body.dark-mode h3, body.dark-mode h4 {
            color: #e0e0e0;
        }
        body.dark-mode blockquote {
            color: #999;
            background: rgba(255,255,255,0.05);
            border-left-color: var(--theme-color);
        }

        /* 表格适配 */
        body.dark-mode .markdown-section tr:nth-child(2n) {
            background-color: rgba(255,255,255,0.03);
        }
        body.dark-mode .markdown-section td, 
        body.dark-mode .markdown-section th {
            border-color: var(--dark-border);
        }

        /* Mermaid 图表适配 (颜色反转) */
        body.dark-mode .mermaid {
            filter: invert(1) hue-rotate(180deg);
        }

        /* Giscus 容器边框适配 */
        body.dark-mode .giscus-container {
            border-top: 1px solid var(--dark-border);
        }

        /* --- 3. 新增：侧边栏开关按钮样式 --- */
        .sidebar-toggle-btn {
            cursor: pointer;
            display: block;
            text-align: center;
            padding: 10px 0;
            margin: 0 15px 10px 15px;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            background-color: rgba(0,0,0,0.05);
            color: #505d6b;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s;
        }
        body.dark-mode .sidebar-toggle-btn {
            background-color: rgba(255,255,255,0.1);
            color: #ccc;
            border: 1px solid #444;
        }
        .sidebar-toggle-btn:hover {
            background-color: var(--theme-color);
            color: white;
        }

        /* 深色模式下修正 docsify 自带 .sidebar-toggle (左下角汉堡) 的浅色背景 */
        /* vue.css 默认写死 background-color: hsla(0,0%,100%,.8)，并在小屏折叠态
           (body.close .sidebar-toggle) 下回写同色，这里一并覆盖 */
        body.dark-mode .sidebar-toggle,
        body.dark-mode.close .sidebar-toggle {
            background-color: transparent;
        }
    </style>
</head>

<body>
    <!-- 语言切换 -->
    <div class="lang-switch">
        <select id="langSelect" onchange="switchLanguage(this.value)" aria-label="Language">
            <option value="zh">中文</option>
            <option value="en">English</option>
            <option value="vi">Tiếng Việt</option>
        </select>
    </div>
    <div id="app"></div>
    <script src="//cdn.jsdelivr.net/npm/mermaid@8.0.0-rc.8/dist/mermaid.min.js"></script>
    <script>
        window.$docsify = {
            name: 'Hello-Agents',
            repo: 'https://github.com/datawhalechina/Hello-Agents',
            loadSidebar: true,
            auto2top: true,
            subMaxLevel: 3,
            relativePath: false,
            alias: {
                // 英文路径映射
                '/en/README.md': '/README_EN.md',
                '/en/README_EN.md': '/README_EN.md',
                '/en/Preface.md': '/Preface.md',
                '/en/_sidebar.md': '/_sidebar_en.md',
                '/en/.*/_sidebar.md': '/_sidebar_en.md',
                '/en/(.*)': '/$1',

                // 越南语路径映射
                '/vi/_sidebar.md': '/vi/_sidebar.md',
                '/vi/.*/_sidebar.md': '/vi/_sidebar.md',

                // 默认中文侧边栏
                '/_sidebar.md': '/_sidebar.md',
                '/.*/_sidebar.md': '/_sidebar.md'
            },
            pagination: {
                previousText: '上一章节',
                nextText: '下一章节',
            },
            count: {
                countable: true,
                fontsize: '0.9em',
                color: 'rgb(90,90,90)',
                language: 'chinese'
            },
            // 多语言配置
            fallbackLanguages: ['en'],
            nameLink: {
                '/en/': '#/en/',
                '/vi/': '#/vi/',
                '/': '#/'
            },
            // 使用钩子动态处理侧边栏
            plugins: [
                // --- 新增：暗黑模式开关插件 ---
                function(hook, vm) {
                    hook.doneEach(function() {
                        const sidebar = document.querySelector('.sidebar-nav');
                        // 防止重复添加
                        if (!sidebar || document.querySelector('.sidebar-toggle-btn')) return;

                        const btn = document.createElement('div');
                        btn.className = 'sidebar-toggle-btn';
                        
                        // 初始化状态
                        const savedTheme = localStorage.getItem('theme-mode');
                        if (savedTheme === 'dark') {
                            document.body.classList.add('dark-mode');
                            btn.textContent = '🌙 Switch to Light';
                        } else {
                            btn.textContent = '☀️ Switch to Dark';
                        }

                        // 核心：点击事件
                        btn.onclick = function() {
                            // 1. 切换类名
                            document.body.classList.toggle('dark-mode');
                            const isDark = document.body.classList.contains('dark-mode');
                            
                            // 2. 保存状态
                            localStorage.setItem('theme-mode', isDark ? 'dark' : 'light');
                            
                            // 3. 更新按钮文字
                            btn.textContent = isDark ? '🌙 Switch to Light' : '☀️ Switch to Dark';
                            
                            // 4. 关键：通知 Giscus 切换主题 (无需刷新)
                            const iframe = document.querySelector('iframe.giscus-frame');
                            if (iframe) {
                                iframe.contentWindow.postMessage({
                                    giscus: {
                                        setConfig: {
                                            theme: isDark ? 'dark' : 'light'
                                        }
                                    }
                                }, 'https://giscus.app');
                            }
                        };

                        // 插入到侧边栏最顶部
                        sidebar.insertBefore(btn, sidebar.firstChild);
                    });
                },

                // --- 原有逻辑：语言偏好处理 ---
                function(hook, vm) {
                    // 在每次路由变化时检查语言偏好
                    hook.beforeEach(function(content) {
                        const preferredLang = localStorage.getItem('preferredLanguage');
                        const currentPath = vm.route.path;

                        // 根据当前路径或语言偏好更新分页文本
                        if (currentPath.includes('/en/') || preferredLang === 'en') {
                            window.$docsify.pagination.previousText = 'Previous';
                            window.$docsify.pagination.nextText = 'Next';
                        } else {
                            window.$docsify.pagination.previousText = '上一章节';
                            window.$docsify.pagination.nextText = '下一章节';
                        }

                        return content;
                    });

                    // 在页面渲染后添加 Giscus 评论区
                    hook.doneEach(function() {
                        // 检查是否是章节页面(排除首页和前言)
                        const currentPath = vm.route.path;
                        const isChapterPage = currentPath.includes('chapter') ||
                                             currentPath.includes('Chapter') ||
                                             currentPath.includes('第') && currentPath.includes('章');

                        if (!isChapterPage) {
                            return; // 非章节页面不显示评论区
                        }

                        // 移除旧的评论区
                        const oldGiscus = document.querySelector('.giscus-container');
                        if (oldGiscus) {
                            oldGiscus.remove();
                        }

                        // 创建评论区容器
                        const giscusContainer = document.createElement('div');
                        giscusContainer.className = 'giscus-container';

                        // 获取语言设置
                        const preferredLang = localStorage.getItem('preferredLanguage');
                        const isVietnamese = currentPath.startsWith('/vi/');
                        const isEnglish = !isVietnamese && (currentPath.includes('/en/') || preferredLang === 'en');

                        // --- 获取当前主题状态 (新增逻辑) ---
                        // 这里是为了在创建 Giscus 时就设置正确的初始主题
                        const isDarkMode = document.body.classList.contains('dark-mode');

                        // 创建可折叠的标题栏
                        const toggleButton = document.createElement('div');
                        toggleButton.className = 'giscus-toggle';

                        const titleDiv = document.createElement('div');
                        titleDiv.className = 'giscus-toggle-title';
                        titleDiv.innerHTML = isVietnamese
                            ? '💬 Thảo luận & Hỏi đáp'
                            : isEnglish
                            ? '💬 Discussion & Questions'
                            : '💬 讨论与提问';

                        const hintText = document.createElement('p');
                        hintText.className = 'giscus-hint';
                        hintText.textContent = isVietnamese
                            ? 'Nhấp để mở rộng/thu gọn'
                            : isEnglish
                            ? 'Click to expand/collapse'
                            : '点击展开/收起';

                        const iconSpan = document.createElement('span');
                        iconSpan.className = 'giscus-toggle-icon';
                        iconSpan.textContent = '▼';

                        const titleWrapper = document.createElement('div');
                        titleWrapper.appendChild(titleDiv);
                        titleWrapper.appendChild(hintText);

                        toggleButton.appendChild(titleWrapper);
                        toggleButton.appendChild(iconSpan);

                        // 创建评论内容容器
                        const contentDiv = document.createElement('div');
                        contentDiv.className = 'giscus-content';

                        // 创建 Giscus 脚本
                        const giscusScript = document.createElement('script');
                        giscusScript.src = 'https://giscus.app/client.js';
                        giscusScript.setAttribute('data-repo', 'datawhalechina/hello-agents');
                        giscusScript.setAttribute('data-repo-id', 'R_kgDOPrUECg');
                        giscusScript.setAttribute('data-category', '💬 Exercises & Q&A');
                        giscusScript.setAttribute('data-category-id', 'DIC_kwDOPrUECs4Cxfyu');
                        giscusScript.setAttribute('data-mapping', 'pathname');
                        giscusScript.setAttribute('data-strict', '0');
                        giscusScript.setAttribute('data-reactions-enabled', '1');
                        giscusScript.setAttribute('data-emit-metadata', '0');
                        giscusScript.setAttribute('data-input-position', 'top');
                        
                        // --- 修改：强制跟随当前 dark-mode 状态 ---
                        // 如果当前 body 有 dark-mode 类，则初始化为 'dark'，否则 'light'
                        giscusScript.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
                        
                        giscusScript.setAttribute('data-lang', isVietnamese ? 'vi' : isEnglish ? 'en' : 'zh-CN');
                        giscusScript.setAttribute('data-loading', 'lazy');
                        giscusScript.crossOrigin = 'anonymous';
                        giscusScript.async = true;

                        contentDiv.appendChild(giscusScript);

                        // 组装评论区
                        giscusContainer.appendChild(toggleButton);
                        giscusContainer.appendChild(contentDiv);

                        // 添加折叠/展开功能
                        let isExpanded = false;
                        toggleButton.addEventListener('click', function() {
                            isExpanded = !isExpanded;
                            if (isExpanded) {
                                contentDiv.classList.add('expanded');
                                iconSpan.classList.add('expanded');
                            } else {
                                contentDiv.classList.remove('expanded');
                                iconSpan.classList.remove('expanded');
                            }
                        });

                        // 将评论区添加到内容区域
                        const article = document.querySelector('article.markdown-section');
                        if (article) {
                            article.appendChild(giscusContainer);
                        }
                    });

                    // Localize docsify chrome (word count and pagination) on Vietnamese routes.
                    hook.doneEach(function() {
                        if (!vm.route.path.startsWith('/vi/')) {
                            return;
                        }

                        const countLabel = document.querySelector('.markdown-section > div > span[style*="float"]');
                        if (countLabel) {
                            const match = countLabel.textContent.trim().match(/^(\d+)\s*字\s*\|\s*(\d+)\s*分钟$/);
                            if (match) {
                                countLabel.textContent = match[1] + ' từ | ' + match[2] + ' phút';
                            }
                        }

                        document.querySelectorAll('.pagination-item').forEach(function(item) {
                            const label = item.querySelector('.pagination-item-label > span');
                            if (!label) {
                                return;
                            }
                            if (item.classList.contains('pagination-item--previous')) {
                                label.textContent = 'Chương trước';
                            } else if (item.classList.contains('pagination-item--next')) {
                                label.textContent = 'Chương sau';
                            }
                        });
                    });
                }
            ]
        }
    </script>
    <!-- Put them above docsify.min.js -->
    <script src="//cdn.jsdelivr.net/npm/docsify@latest/lib/docsify.min.js"></script>
    <!-- code render-->
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-bash.js"></script>
    <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-python.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination@latest/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code"></script>

    <!-- 新增：图片放大插件 (官方) -->
    <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@3"></script>
    <!-- CDN files for docsify-katex -->
    <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
    <!-- 字数统计 -->
    <script src="//unpkg.com/docsify-count/dist/countable.js"></script>

    <!-- 语言切换脚本 -->
    <script>
        // Canonical per-language filenames for chapters 1-16.
        const chapterFiles = {
            zh: [
                '第一章 初识智能体.md',
                '第二章 智能体发展史.md',
                '第三章 大语言模型基础.md',
                '第四章 智能体经典范式构建.md',
                '第五章 基于低代码平台的智能体搭建.md',
                '第六章 框架开发实践.md',
                '第七章 构建你的Agent框架.md',
                '第八章 记忆与检索.md',
                '第九章 上下文工程.md',
                '第十章 智能体通信协议.md',
                '第十一章 Agentic-RL.md',
                '第十二章 智能体性能评估.md',
                '第十三章 智能旅行助手.md',
                '第十四章 自动化深度研究智能体.md',
                '第十五章 构建赛博小镇.md',
                '第十六章 毕业设计.md'
            ],
            en: [
                'Chapter1-Introduction-to-Agents.md',
                'Chapter2-History-of-Agents.md',
                'Chapter3-Fundamentals-of-Large-Language-Models.md',
                'Chapter4-Building-Classic-Agent-Paradigms.md',
                'Chapter5-Building-Agents-with-Low-Code-Platforms.md',
                'Chapter6-Framework-Development-Practice.md',
                'Chapter7-Building-Your-Agent-Framework.md',
                'Chapter8-Memory-and-Retrieval.md',
                'Chapter9-Context-Engineering.md',
                'Chapter10-Agent-Communication-Protocols.md',
                'Chapter11-Agentic-RL.md',
                'Chapter12-Agent-Performance-Evaluation.md',
                'Chapter13-Intelligent-Travel-Assistant.md',
                'Chapter14-Automated-Deep-Research-Agent.md',
                'Chapter15-Building-Cyber-Town.md',
                'Chapter16-Graduation-Project.md'
            ],
            vi: [
                'Chuong1-Gioi-thieu-ve-Agent.md',
                'Chuong2-Lich-su-phat-trien-cua-Agent.md',
                'Chuong3-Co-so-mo-hinh-ngon-ngu-lon.md',
                'Chuong4-Xay-dung-cac-mo-hinh-Agent-kinh-dien.md',
                'Chuong5-Xay-dung-Agent-voi-nen-tang-low-code.md',
                'Chuong6-Thuc-hanh-phat-trien-voi-framework.md',
                'Chuong7-Xay-dung-framework-Agent-cua-ban.md',
                'Chuong8-Bo-nho-va-truy-xuat.md',
                'Chuong9-Ky-thuat-ngu-canh.md',
                'Chuong10-Giao-thuc-giao-tiep-Agent.md',
                'Chuong11-Agentic-RL.md',
                'Chuong12-Danh-gia-hieu-nang-Agent.md',
                'Chuong13-Tro-ly-du-lich-thong-minh.md',
                'Chuong14-Agent-nghien-cuu-chuyen-sau-tu-dong.md',
                'Chuong15-Xay-dung-thi-tran-cyber.md',
                'Chuong16-Do-an-tot-nghiep.md'
            ]
        };

        // Capture the stored preference before Docsify can emit hashchange events.
        const initialPreferredLanguage = localStorage.getItem('preferredLanguage');
        let startupPreferenceApplied = false;

        function decodeRoute(hash) {
            let path = hash.replace(/^#\/?/, '').split('?')[0];
            try {
                path = decodeURIComponent(path);
            } catch (e) {
                // Keep the raw path when it is not valid percent-encoding.
            }
            return path.replace(/\.md$/i, '').replace(/\/+$/, '');
        }

        function detectLanguage(hash) {
            if (/^#\/vi(?:\/|$)/.test(hash)) {
                return 'vi';
            }
            if (/^#\/en(?:\/|$)/.test(hash) || /^#\/README_EN\.md(?:[?#]|$)/.test(hash)) {
                return 'en';
            }
            return 'zh';
        }

        function getRouteKey(hash) {
            const path = decodeRoute(hash);
            if (!path || path === 'README' || path === 'README_EN' ||
                path === 'en' || path === 'vi' ||
                path === 'en/README' || path === 'en/README_EN' || path === 'vi/README') {
                return 'landing';
            }
            if (path === 'Preface' || path === 'en/Preface' ||
                path === 'vi/Preface' || path === '前言') {
                return 'preface';
            }
            const match = path.match(/(?:^|\/)chapter(\d+)\//i);
            return match ? 'chapter' + Number(match[1]) : null;
        }

        function routeFor(lang, key) {
            if (key === 'preface') {
                return lang === 'zh'
                    ? '#/前言.md'
                    : lang === 'en'
                    ? '#/en/Preface.md'
                    : '#/vi/Preface.md';
            }

            const chapter = /^chapter(\d+)$/.exec(key || '');
            if (chapter) {
                const number = Number(chapter[1]);
                const filename = chapterFiles[lang] && chapterFiles[lang][number - 1];
                if (filename) {
                    const prefix = lang === 'en' ? 'en/' : lang === 'vi' ? 'vi/' : '';
                    return '#/' + prefix + 'chapter' + number + '/' + filename;
                }
            }

            return lang === 'zh'
                ? '#/README.md'
                : lang === 'en'
                ? '#/en/README_EN.md'
                : '#/vi/README.md';
        }

        function updateLanguageSelector() {
            const selector = document.getElementById('langSelect');
            if (selector) {
                selector.value = detectLanguage(window.location.hash);
            }
        }

        function switchLanguage(lang) {
            if (lang !== 'zh' && lang !== 'en' && lang !== 'vi') {
                return;
            }

            const key = getRouteKey(window.location.hash) || 'landing';
            const route = routeFor(lang, key);
            localStorage.setItem('preferredLanguage', lang);

            if (window.location.hash !== route) {
                window.location.hash = route;
                // Reload to apply the language-specific sidebar.
                window.location.reload();
            } else {
                updateLanguageSelector();
            }
        }

        // Apply the captured startup preference before hashchange may persist the route language.
        window.addEventListener('load', function() {
            const preferredLang = initialPreferredLanguage;
            if ((preferredLang === 'zh' || preferredLang === 'en' || preferredLang === 'vi') &&
                preferredLang !== detectLanguage(window.location.hash)) {
                const key = getRouteKey(window.location.hash) || 'landing';
                window.location.hash = routeFor(preferredLang, key);
            }
            startupPreferenceApplied = true;
            updateLanguageSelector();
        });

        window.addEventListener('hashchange', function() {
            updateLanguageSelector();
            if (startupPreferenceApplied) {
                localStorage.setItem('preferredLanguage', detectLanguage(window.location.hash));
            }
        });

        // Route language-selector links through Docsify instead of loading raw Markdown.
        document.addEventListener('click', function(event) {
            const link = event.target.closest && event.target.closest('a[href]');
            if (!link || link.target || event.defaultPrevented ||
                event.button > 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                return;
            }

            let url;
            try {
                url = new URL(link.href, window.location.href);
            } catch (e) {
                return;
            }

            if (url.origin !== window.location.origin) {
                return;
            }

            // Resolve from the authored href, not the served path, so this also
            // works when the site is hosted under a sub-path.
            const href = (link.getAttribute('href') || '').split('#')[0].split('?')[0];
            const filename = href.split('/').pop();
            let route = null;
            if (filename === 'README_EN.md') {
                route = '#/en/README_EN.md';
            } else if (filename === 'README.md') {
                route = href.indexOf('vi/') !== -1 ? '#/vi/README.md' : '#/README.md';
            }

            if (!route) {
                return;
            }

            localStorage.setItem('preferredLanguage', detectLanguage(route));
            event.preventDefault();
            window.location.hash = route;
            updateLanguageSelector();
        });
    </script>
</body>

</html>
