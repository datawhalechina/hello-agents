        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: Paste a redacted support message. Do not include API keys,
      passwords, payment details or personal documents. This creates a draft for human
      review; it does not send anything.
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
