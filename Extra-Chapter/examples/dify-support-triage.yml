app:
  description: Turn a redacted support message into a category, known facts, missing
    information and a reply draft in the sender's language. Human review required;
    no email or account actions.
  icon: 📨
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: Multilingual Support Triage
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.68@ba61c5eccb814be7364117c0bec3710a51e09b20f31e37243e747a00f9377969
    version: null
kind: app
version: 0.7.0
